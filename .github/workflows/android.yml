name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  GODOT_VERSION: "4.7.2"
  GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
  GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3

            - name: Android SDK hazirla
        run: |
          set -e
          SDK="${ANDROID_SDK_ROOT:-$HOME/android-sdk}"
          echo "SDK dizini: $SDK"
          if [ ! -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo "cmdline-tools yok, indiriliyor"
            mkdir -p "$SDK/cmdline-tools"
            curl -L -o /tmp/cmdline.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/cmdline.zip -d /tmp/cmdline
            mv /tmp/cmdline/cmdline-tools "$SDK/cmdline-tools/latest"
          fi
          SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --sdk_root="$SDK" --licenses > /dev/null 2>&1 || true
          "$SDKM" --sdk_root="$SDK" "platform-tools" "build-tools;35.0.1" "platforms;android-35"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"

      - name: Godot indir
        run: |
          curl -L -o godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          chmod +x godot

      - name: Sablonlar
        run: |
          curl -L -o templates.tpz \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          mkdir -p "$HOME/.local/share/godot/export_templates"
          unzip -q templates.tpz -d /tmp/tpl
          mv /tmp/tpl/templates "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"

      - name: Anahtar uret
        run: |
          keytool -keyalg RSA -genkeypair -alias androiddebugkey \
            -keypass android -keystore "$GITHUB_WORKSPACE/debug.keystore" \
            -storepass android -dname "CN=Android Debug,O=Android,C=US" \
            -validity 9999 -deststoretype pkcs12
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$GITHUB_WORKSPACE/debug.keystore" >> "$GITHUB_ENV"

      - name: Iceri al
        run: ./godot --headless --path . --import

      - name: APK uret
        run: |
          mkdir -p build
          ./godot --headless --path . --export-debug "Android" build/zincir.apk

      - uses: actions/upload-artifact@v4
        with:
          name: zincir-apk
          path: build/zincir.apk
          if-no-files-found: error
